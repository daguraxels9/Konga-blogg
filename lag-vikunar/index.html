<!DOCTYPE html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lag vikunnar — Elvar Freyr</title>
    <link rel="icon" type="image/jpeg" href="../Images/profile.jpg" />
    <link rel="apple-touch-icon" href="../Images/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="../home/">Elvar Freyr</a>
        <nav class="site-nav" aria-label="Aðalvalmynd">
          <a href="../home/">Heim</a>
          <a href="../ljosmynd-vikunar/">Ljósmynd vikunnar</a>
          <a href="../lag-vikunar/">Lag vikunnar</a>
          <a href="../kona-vikunar/">Kona vikunnar</a>
          <a href="../texti-vikunar/">Texti vikunnar</a>
        </nav>
      </div>
    </header>

    <main class="entry single-entry">
      <div class="container">
        <header class="entry-header compact-header">
          <span class="eyebrow">Lag vikunnar</span>
          <h1>Lag Vikunar</h1>
          <div class="details">
            <span>Vika 1</span>
            <span>Flytjandi: Sól</span>
            <span>Íslenskur pop</span>
          </div>
        </header>

        <img class="page-image" src="../Images/lag-vikunar 3.JPG" alt="Lag vikunnar" />

        <div class="single-text-block" id="text-content"></div>
        <details class="week-archive">
          <summary>Vika 2</summary>
          <img class="archive-image" src="../Images/lag-vikunar 2.JPG" alt="Lag vikunnar, Vika 2" />
          <div id="week-2-content" class="single-text-block"></div>
        </details>
        <details class="week-archive">
          <summary>Vika 3</summary>
          <img class="archive-image" src="../Images/lag-vikunar.JPG" alt="Lag vikunnar, Vika 3" />
          <div id="week-3-content" class="single-text-block"></div>
        </details>
      </div>
    </main>

    <footer class="page-footer">
      <div class="container">© 2026 Elvar Freyr</div>
    </footer>

    <script>
      fetch('../Textar/lag-vikunar.txt')
        .then((response) => {
          if (!response.ok) throw new Error('Text file not found');
          return response.text();
        })
        .then((text) => {
          const container = document.getElementById('text-content');
          if (!container) return;

          const paragraphs = text
            .split(/\n\s*\n/)
            .map((paragraph) => paragraph.trim())
            .filter(Boolean);

          container.innerHTML = paragraphs
            .map((paragraph) => `<p>${paragraph.replace(/\n/g, ' ')}</p>`)
            .join('');
        })
        .catch(() => {
          const container = document.getElementById('text-content');
          if (container) {
            container.innerHTML = '<p>Textinn er ekki tiltækur.</p>';
          }
        });
    </script>
    <script>
      fetch('../Textar/vika-2/lag-vikunar.txt')
        .then((response) => response.text())
        .then((text) => {
          const container = document.getElementById('week-2-content');
          if (!container) return;
          container.innerHTML = text
            .split(/\n\s*\n/)
            .map((paragraph) => paragraph.trim())
            .filter(Boolean)
            .map((paragraph) => `<p>${paragraph.replace(/\n/g, ' ')}</p>`)
            .join('');
        });
    </script>
    <script>
      fetch('../Textar/vika-3/lag-vikunar.txt')
        .then((response) => response.text())
        .then((text) => {
          const container = document.getElementById('week-3-content');
          if (!container) return;
          container.innerHTML = text
            .split(/\n\s*\n/)
            .map((paragraph) => paragraph.trim())
            .filter(Boolean)
            .map((paragraph) => `<p>${paragraph.replace(/\n/g, ' ')}</p>`)
            .join('');
        });
    </script>
  </body>
</html>
